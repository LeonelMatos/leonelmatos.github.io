<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leonel Matos</title>
  <link rel="icon" type="image/x-icon" href="/assets/icons/tab_ico.svg">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/blog-cards.css">
  <link rel="preconnect" href="https://images.unsplash.com">
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      corePlugins: {
        preflight: false
      },
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            neutral: {
              50: '#fafafa',
              100: '#f5f5f5',
              200: '#e5e5e5',
              300: '#d4d4d4',
              400: '#a3a3a3',
              500: '#737373',
              600: '#525252',
              700: '#404040',
              800: '#262626',
              900: '#171717',
              950: '#0a0a0a',
            },
          }
        }
      }
    };
  </script>
</head>
<body class="font-inter antialiased bg-neutral-50 text-neutral-900 dark:bg-neutral-900 dark:text-neutral-50">
  <div id="app" class="min-h-screen rounded-lg p-4 sm:p-6 md:p-8 max-w-6xl mx-auto">
    <!-- Dark Mode Toggle -->
    <div id="darkModeToggleContainer" class="fixed top-4 right-4 z-50">
      <button id="darkModeToggle"
        class="p-2 rounded-full bg-neutral-200 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 hover:bg-neutral-300 dark:hover:bg-neutral-700 transition-colors duration-200 shadow-md focus:outline-none focus:ring-2 focus:ring-neutral-500 focus:ring-opacity-50"
        aria-label="Toggle dark mode">
      </button>
    </div>
    <!-- Header-->
    <div id="headerContainer"></div>
    
    <main class="max-w-4xl mx-auto">
      <div class="p-6 bg-neutral-100 dark:bg-neutral-800 rounded-lg shadow-sm">
        <h1 class="text-3xl font-bold mb-6 text-neutral-900 dark:text-neutral-50">Blog Posts</h1>
        <div id="blogPostsContainer"></div>
      </div>
    </main>
    
    <!-- Footer -->
    <div id="footerContainer"></div>
  </div>

  <div id="fullPostContainer" class="fixed inset-0 z-50 hidden overflow-y-auto bg-black/50 backdrop-blur-sm"></div>

  <script type="module">
    import { renderHeader } from './js/components/ui/header.js';
    import { renderTopNavigation } from './js/components/ui/top-navigation.js';
    import { renderFooter } from './js/components/ui/footer.js';
    import { renderBlogList, renderFullPost } from './js/components/sections/blog.js';
    import './js/darkmode.js';

    // Function to hide full post view
    function hideFullPost() {
      const container = document.getElementById('fullPostContainer');
      container.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }

    // Handle post navigation
    function initBlogNavigation() {
      // Handle card clicks
      document.querySelectorAll('.blog-card').forEach(card => {
        card.addEventListener('click', () => {
          const postId = card.dataset.id;
          showFullPost(postId);
        });
      });
    }
    
    // Show full post view
    function showFullPost(postId) {
      const container = document.getElementById('fullPostContainer');
      if (!container) return;
      
      container.innerHTML = renderFullPost(postId);
      container.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
      
      // Add back button event
      document.getElementById('back-to-posts').addEventListener('click', hideFullPost);

      // Add click outside to close functionality
      const postCard = container.querySelector('.post-card');
      container.addEventListener('click', (e) => {
        // Check if click is outside the post card
        if (postCard && !postCard.contains(e.target)) {
          hideFullPost();
        }
      });
    }

    // Show post list view
    function showPostList() {
      const container = document.getElementById('blogPostsContainer');
      if (!container) return;
      
      container.innerHTML = renderBlogList();
      initBlogNavigation();
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Render header and navigation
      const headerContainer = document.getElementById('headerContainer');
      if (headerContainer) {
        headerContainer.innerHTML = renderHeader();
        const topNavContainer = document.getElementById('topNavigationContainer');
        if (topNavContainer) topNavContainer.innerHTML = renderTopNavigation();
      }
      
      // Render blog content
      showPostList();
      
      // Render footer
      const footerContainer = document.getElementById('footerContainer');
      if (footerContainer) footerContainer.innerHTML = renderFooter();
    });
  </script>
</body>
</html>
